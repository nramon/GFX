name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full cppcheck
          python -m pip install pytest pillow numpy coverage flake8

      # The Open Watcom and shellcheck downloads are large: cache them. The key
      # changes when the pinned versions in the Makefile change.
      - uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-${{ hashFiles('Makefile') }}

      - name: Toolchain
        run: make toolchain

      - name: Build the demos
        run: make

      - name: Lint
        run: make lint

      - name: Tests and coverage
        run: make coverage

      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
